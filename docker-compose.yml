services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://skillspoints:skillspoints_dev@db:5432/skillspoints?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillspoints
      POSTGRES_USER: skillspoints
      POSTGRES_PASSWORD: skillspoints_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillspoints -d skillspoints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
