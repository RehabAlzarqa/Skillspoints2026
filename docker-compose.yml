services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rncpdb
      MYSQL_USER: rncpuser
      MYSQL_PASSWORD: rncppass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: